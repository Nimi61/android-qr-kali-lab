<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kali Android Lab - Pair</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #11151c;
      color: #e6edf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: #1a2029;
      border: 1px solid #2c3442;
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #9aa7b8; font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #0b0f14;
      background: #4cc38a;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { margin-top: 18px; font-size: 0.9rem; min-height: 1.4em; }
    .ok { color: #4cc38a; }
    .error { color: #f2766b; }
  </style>
</head>
<body>
  <main>
    <h1>Kali Android Lab</h1>
    <p>Send a pairing request to the Kali host that served this page.</p>
    <button id="pair">Pair with Kali</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const button = document.getElementById("pair");
    const status = document.getElementById("status");
    const token = new URLSearchParams(location.search).get("token") || "";

    function show(message, kind) {
      status.textContent = message;
      status.className = kind || "";
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      show("Contacting Kali...");

      const headers = { "Content-Type": "application/json" };
      if (token) headers["X-Pair-Token"] = token;

      try {
        const response = await fetch("/pair", { method: "POST", headers });
        const result = await response.json().catch(() => ({}));

        if (response.ok && result.status === "paired") {
          show("Paired with Kali.", "ok");
        } else if (response.status === 401) {
          show("Rejected: missing or invalid token.", "error");
        } else {
          show(`Failed (HTTP ${response.status}).`, "error");
        }
      } catch (error) {
        show("Could not reach Kali. Same network?", "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
